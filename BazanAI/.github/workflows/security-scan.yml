name: Weekly Security Scan
on:
  schedule:
    - cron: '0 0 * * 0'
jobs:
  snyk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BazanAI
    steps:
    - uses: actions/checkout@v3
    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/dotnet@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
